# QLoRA run for ru-guard-1.5b (Phase 4). Read by training/train_qlora.py.
# Same as qwen2.5-0.5b.yaml except the base model and the batch split (T4 memory).
run_name: ru-guard-1.5b
base_model: Qwen/Qwen2.5-1.5B-Instruct
max_seq_len: 512
load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup: 0.03
  per_device_batch: 4
  grad_accum: 8                    # effective batch 32
  weight_decay: 0.0
  optim: adamw_8bit
  fp16: true
  logging_steps: 10
  seed: 1234

data:
  train_path: data/processed/train.jsonl
  val_path: data/processed/val.jsonl
  include_en: true

val_gen:
  n: 200
  batch_size: 16
  max_new_tokens: 8
