<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 640" role="img">
<title>RAG pipeline with guard checkpoints G0 to G4</title>
<desc>Offline ingest scans documents at G0 before chunking and storing them in Chroma, with flagged chunks going to quarantine. The online lane scans the question at G1, retrieved chunks at G2, builds the prompt at G3, generates with a chat model and validates the output at G4. All scans go through the client SDK to guard-api, which calls Ollama and writes an audit log.</desc>
<style>:root{--bg:#ffffff;--p:#1f1e1d;--s:#5f5e5a;--b:#b4b2a9}@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--p:#f1efe8;--s:#b4b2a9;--b:#5f5e5a}}text{font-family:Inter,"Anthropic Sans","Segoe UI",Helvetica,Arial,sans-serif}.t{font-size:14px;fill:var(--p)}.ts{font-size:12px;fill:var(--s)}.th{font-size:14px;font-weight:500;fill:var(--p)}.arr{stroke:var(--s);stroke-width:1.5;fill:none}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}@media (prefers-color-scheme:dark){.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#D3D1C7}.c-gray>.ts{fill:#B4B2A9}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#F5C4B3}.c-coral>.ts{fill:#F0997B}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}}</style><rect width="680" height="640" fill="var(--bg)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="24" y="20" width="632" height="170" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="640" y="42" text-anchor="end">Offline: ingest and index</text>
<rect x="24" y="210" width="632" height="222" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="640" y="232" text-anchor="end">Online: answer a question</text>
<rect x="24" y="458" width="632" height="126" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="640" y="478" text-anchor="end">Guard service over HTTP</text>

<g class="node c-gray">
<rect x="40" y="56" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="103" y="74" text-anchor="middle" dominant-baseline="central">Documents</text>
<text class="ts" x="103" y="90" text-anchor="middle" dominant-baseline="central">Text files</text></g>
<g class="node c-coral">
<rect x="194" y="56" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="257" y="74" text-anchor="middle" dominant-baseline="central">G0 scan</text>
<text class="ts" x="257" y="90" text-anchor="middle" dominant-baseline="central">ingest time</text></g>
<g class="node c-gray">
<rect x="348" y="56" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="411" y="74" text-anchor="middle" dominant-baseline="central">Chunk, embed</text>
<text class="ts" x="411" y="90" text-anchor="middle" dominant-baseline="central">tiktoken sizes</text></g>
<g class="node c-gray">
<rect x="502" y="56" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="74" text-anchor="middle" dominant-baseline="central">Chroma</text>
<text class="ts" x="565" y="90" text-anchor="middle" dominant-baseline="central">vector store</text></g>
<g class="node c-coral">
<rect x="194" y="132" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="257" y="150" text-anchor="middle" dominant-baseline="central">Quarantine</text>
<text class="ts" x="257" y="166" text-anchor="middle" dominant-baseline="central">PII-masked</text></g>
<line x1="166" y1="80" x2="192" y2="80" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="80" x2="346" y2="80" class="arr" marker-end="url(#arrow)"/>
<line x1="474" y1="80" x2="500" y2="80" class="arr" marker-end="url(#arrow)"/>
<line x1="257" y1="106" x2="257" y2="130" class="arr" marker-end="url(#arrow)"/>
<path d="M565 106 L565 156 L411 156 L411 246" fill="none" class="arr" marker-end="url(#arrow)"/>

<g class="node c-gray">
<rect x="40" y="248" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="103" y="266" text-anchor="middle" dominant-baseline="central">User question</text>
<text class="ts" x="103" y="282" text-anchor="middle" dominant-baseline="central">chat input</text></g>
<g class="node c-coral">
<rect x="194" y="248" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="257" y="266" text-anchor="middle" dominant-baseline="central">G1 scan</text>
<text class="ts" x="257" y="282" text-anchor="middle" dominant-baseline="central">blocks attacks</text></g>
<g class="node c-gray">
<rect x="348" y="248" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="411" y="266" text-anchor="middle" dominant-baseline="central">Retrieve</text>
<text class="ts" x="411" y="282" text-anchor="middle" dominant-baseline="central">top-k chunks</text></g>
<g class="node c-coral">
<rect x="502" y="248" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="266" text-anchor="middle" dominant-baseline="central">G2 scan</text>
<text class="ts" x="565" y="282" text-anchor="middle" dominant-baseline="central">drops flagged</text></g>
<line x1="166" y1="272" x2="192" y2="272" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="272" x2="346" y2="272" class="arr" marker-end="url(#arrow)"/>
<line x1="474" y1="272" x2="500" y2="272" class="arr" marker-end="url(#arrow)"/>
<path d="M565 298 L565 323 L103 323 L103 348" fill="none" class="arr" marker-end="url(#arrow)"/>

<g class="node c-coral">
<rect x="40" y="350" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="103" y="368" text-anchor="middle" dominant-baseline="central">G3 prompt</text>
<text class="ts" x="103" y="384" text-anchor="middle" dominant-baseline="central">tags + canary</text></g>
<g class="node c-gray">
<rect x="194" y="350" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="257" y="368" text-anchor="middle" dominant-baseline="central">Chat model</text>
<text class="ts" x="257" y="384" text-anchor="middle" dominant-baseline="central">Ollama qwen2.5</text></g>
<g class="node c-coral">
<rect x="348" y="350" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="411" y="368" text-anchor="middle" dominant-baseline="central">G4 validate</text>
<text class="ts" x="411" y="384" text-anchor="middle" dominant-baseline="central">schema + canary</text></g>
<g class="node c-gray">
<rect x="502" y="350" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="368" text-anchor="middle" dominant-baseline="central">Answer</text>
<text class="ts" x="565" y="384" text-anchor="middle" dominant-baseline="central">with citations</text></g>
<line x1="166" y1="374" x2="192" y2="374" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="374" x2="346" y2="374" class="arr" marker-end="url(#arrow)"/>
<line x1="474" y1="374" x2="500" y2="374" class="arr" marker-end="url(#arrow)"/>

<line x1="103" y1="434" x2="103" y2="488" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="115" y="452">G0 to G4 call over HTTP</text>

<g class="node c-coral">
<rect x="40" y="490" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="103" y="508" text-anchor="middle" dominant-baseline="central">client/ SDK</text>
<text class="ts" x="103" y="524" text-anchor="middle" dominant-baseline="central">sync + async</text></g>
<g class="node c-coral">
<rect x="194" y="490" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="257" y="508" text-anchor="middle" dominant-baseline="central">guard-api</text>
<text class="ts" x="257" y="524" text-anchor="middle" dominant-baseline="central">:8001, policy</text></g>
<g class="node c-coral">
<rect x="348" y="490" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="411" y="508" text-anchor="middle" dominant-baseline="central">Ollama</text>
<text class="ts" x="411" y="524" text-anchor="middle" dominant-baseline="central">ru-guard model</text></g>
<g class="node c-coral">
<rect x="502" y="490" width="126" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="508" text-anchor="middle" dominant-baseline="central">Audit log</text>
<text class="ts" x="565" y="524" text-anchor="middle" dominant-baseline="central">hash + length</text></g>
<line x1="166" y1="514" x2="192" y2="514" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="514" x2="346" y2="514" class="arr" marker-end="url(#arrow)"/>
<path d="M257 540 L257 564 L565 564 L565 542" fill="none" class="arr" marker-end="url(#arrow)"/>

<rect class="c-gray" x="40" y="604" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="62" y="615">RAG step</text>
<rect class="c-coral" x="150" y="604" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="172" y="615">Guard checkpoint or service</text>
</svg>
