<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 546" role="img">
<title>RU-Guard CI/CD pipeline</title>
<desc>Three lanes. On every pull request: fast checks, fetch the GGUF from the GitHub release, a 100-row smoke eval, then a merge gate that either allows the merge to main or blocks it. Nightly on main: fetch the GGUF, full 300-row eval, attack suites for ASR and red-team, and uploaded reports. Release by the owner: eval report, thresholds set to metrics minus 2 points, tag and GitHub release with the GGUF attached, and a local run with docker compose.</desc>
<style>:root{--bg:#ffffff;--p:#1f1e1d;--s:#5f5e5a;--b:#b4b2a9}@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--p:#f1efe8;--s:#b4b2a9;--b:#5f5e5a}}text{font-family:Inter,"Anthropic Sans","Segoe UI",Helvetica,Arial,sans-serif}.t{font-size:14px;fill:var(--p)}.ts{font-size:12px;fill:var(--s)}.th{font-size:14px;font-weight:500;fill:var(--p)}.arr{stroke:var(--s);stroke-width:1.5;fill:none}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}@media (prefers-color-scheme:dark){.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#D3D1C7}.c-gray>.ts{fill:#B4B2A9}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#F5C4B3}.c-coral>.ts{fill:#F0997B}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}}</style><rect width="680" height="546" fill="var(--bg)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="24" y="20" width="632" height="196" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="40" y="38">Every pull request</text>
<rect x="24" y="240" width="632" height="108" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="40" y="258">Nightly, on main</text>
<rect x="24" y="372" width="632" height="108" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="40" y="390">Release: owner publishes a model</text>

<g class="node c-teal">
<rect x="40" y="52" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="105" y="72" text-anchor="middle" dominant-baseline="central">Fast checks</text>
<text class="ts" x="105" y="90" text-anchor="middle" dominant-baseline="central">tests, no model</text></g>
<g class="node c-gray">
<rect x="194" y="52" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="259" y="72" text-anchor="middle" dominant-baseline="central">Fetch GGUF</text>
<text class="ts" x="259" y="90" text-anchor="middle" dominant-baseline="central">GitHub release</text></g>
<g class="node c-teal">
<rect x="348" y="52" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="413" y="72" text-anchor="middle" dominant-baseline="central">Smoke eval</text>
<text class="ts" x="413" y="90" text-anchor="middle" dominant-baseline="central">100 rows</text></g>
<g class="node c-coral">
<rect x="502" y="52" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="567" y="72" text-anchor="middle" dominant-baseline="central">Merge gate</text>
<text class="ts" x="567" y="90" text-anchor="middle" dominant-baseline="central">gate.py check</text></g>
<line x1="172" y1="80" x2="192" y2="80" class="arr" marker-end="url(#arrow)"/>
<line x1="326" y1="80" x2="346" y2="80" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="80" x2="500" y2="80" class="arr" marker-end="url(#arrow)"/>

<g class="node c-coral">
<rect x="348" y="140" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="413" y="160" text-anchor="middle" dominant-baseline="central">Blocked</text>
<text class="ts" x="413" y="178" text-anchor="middle" dominant-baseline="central">red: fix, push</text></g>
<g class="node c-gray">
<rect x="502" y="140" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="567" y="160" text-anchor="middle" dominant-baseline="central">Merge to main</text>
<text class="ts" x="567" y="178" text-anchor="middle" dominant-baseline="central">all green</text></g>
<path d="M520 110 L520 124 L413 124 L413 138" fill="none" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="567" y1="110" x2="567" y2="138" class="arr" marker-end="url(#arrow)"/>

<g class="node c-gray">
<rect x="40" y="272" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="105" y="292" text-anchor="middle" dominant-baseline="central">Fetch GGUF</text>
<text class="ts" x="105" y="310" text-anchor="middle" dominant-baseline="central">GitHub release</text></g>
<g class="node c-teal">
<rect x="194" y="272" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="259" y="292" text-anchor="middle" dominant-baseline="central">Full eval</text>
<text class="ts" x="259" y="310" text-anchor="middle" dominant-baseline="central">300 rows + gate</text></g>
<g class="node c-teal">
<rect x="348" y="272" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="413" y="292" text-anchor="middle" dominant-baseline="central">Attack suites</text>
<text class="ts" x="413" y="310" text-anchor="middle" dominant-baseline="central">ASR + red-team</text></g>
<g class="node c-gray">
<rect x="502" y="272" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="567" y="292" text-anchor="middle" dominant-baseline="central">Reports</text>
<text class="ts" x="567" y="310" text-anchor="middle" dominant-baseline="central">run artifacts</text></g>
<line x1="172" y1="300" x2="192" y2="300" class="arr" marker-end="url(#arrow)"/>
<line x1="326" y1="300" x2="346" y2="300" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="300" x2="500" y2="300" class="arr" marker-end="url(#arrow)"/>

<g class="node c-gray">
<rect x="40" y="404" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="105" y="424" text-anchor="middle" dominant-baseline="central">Eval report</text>
<text class="ts" x="105" y="442" text-anchor="middle" dominant-baseline="central">model chosen</text></g>
<g class="node c-coral">
<rect x="194" y="404" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="259" y="424" text-anchor="middle" dominant-baseline="central">Set thresholds</text>
<text class="ts" x="259" y="442" text-anchor="middle" dominant-baseline="central">minus 2 points</text></g>
<g class="node c-gray">
<rect x="348" y="404" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="413" y="424" text-anchor="middle" dominant-baseline="central">Tag + release</text>
<text class="ts" x="413" y="442" text-anchor="middle" dominant-baseline="central">GGUF attached</text></g>
<g class="node c-gray">
<rect x="502" y="404" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="567" y="424" text-anchor="middle" dominant-baseline="central">Run locally</text>
<text class="ts" x="567" y="442" text-anchor="middle" dominant-baseline="central">docker compose</text></g>
<line x1="172" y1="432" x2="192" y2="432" class="arr" marker-end="url(#arrow)"/>
<line x1="326" y1="432" x2="346" y2="432" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="432" x2="500" y2="432" class="arr" marker-end="url(#arrow)"/>

<rect class="c-teal" x="40" y="508" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="62" y="519">Automated check</text>
<rect class="c-coral" x="200" y="508" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="222" y="519">Gate or threshold</text>
<rect class="c-gray" x="370" y="508" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="392" y="519">Artifact or action</text>
</svg>
