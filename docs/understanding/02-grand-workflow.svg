<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 626" role="img">
<title>RU-Guard grand workflow</title>
<desc>Four lanes. Build: seeds feed synthetic data generation, QLoRA tuning and GGUF export on Colab. Serve: the GGUF is registered in Ollama, which guard-api calls, with an audit store alongside. Protect: MCP gateway, the demo_rag reference app and the Flutter playground call guard-api through the client SDK. Prove and gate: the frozen test set feeds evaluation, which measures guard-api and demo_rag, and a CI gate that also receives the GGUF release asset.</desc>
<style>:root{--bg:#ffffff;--p:#1f1e1d;--s:#5f5e5a;--b:#b4b2a9}@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--p:#f1efe8;--s:#b4b2a9;--b:#5f5e5a}}text{font-family:Inter,"Anthropic Sans","Segoe UI",Helvetica,Arial,sans-serif}.t{font-size:14px;fill:var(--p)}.ts{font-size:12px;fill:var(--s)}.th{font-size:14px;font-weight:500;fill:var(--p)}.arr{stroke:var(--s);stroke-width:1.5;fill:none}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}@media (prefers-color-scheme:dark){.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#D3D1C7}.c-gray>.ts{fill:#B4B2A9}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#F5C4B3}.c-coral>.ts{fill:#F0997B}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}}</style><rect width="680" height="626" fill="var(--bg)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

