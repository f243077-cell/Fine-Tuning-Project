services:
  ollama:
    # Pinned to the Ollama version used for the Phase 5 evaluation (evals/reports/EVAL_REPORT.md).
    image: ollama/ollama:0.32.15
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models:ro

  guard-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.guard
    ports: ["8001:8001"]
    environment:
      OLLAMA_URL: http://ollama:11434
      GUARD_MODEL: ${GUARD_MODEL:-ru-guard-1.5b-v2}
      GUARD_API_KEY: ${GUARD_API_KEY:-}
      AUDIT_SALT: ${AUDIT_SALT:-}
      FAIL_MODE: ${FAIL_MODE:-closed}
      MODE: ${MODE:-enforce}
      RATE_LIMIT: ${RATE_LIMIT:-120/minute}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      DB_PATH: /data/guard.db
    volumes:
      - guard_data:/data
    depends_on: [ollama]

  demo-rag:                      # reference app; start with: docker compose --profile demo up --build
    profiles: ["demo"]
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    ports: ["8002:8002"]
    environment:
      GUARD_URL: http://guard-api:8001
      GUARD_API_KEY: ${GUARD_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:1.5b-instruct}
      GUARD_ENABLED: ${GUARD_ENABLED:-true}
      ALLOW_GUARD_TOGGLE: ${ALLOW_GUARD_TOGGLE:-false}
      INGEST_GUARD: ${INGEST_GUARD:-on}
    volumes:
      - demo_data:/data
    depends_on: [guard-api, ollama]

volumes:
  ollama_data: {}
  guard_data: {}
  demo_data: {}
