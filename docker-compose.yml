services:
  ollama:
    # Pinned to the Ollama version used for the Phase 5 evaluation (evals/reports/EVAL_REPORT.md).
    image: ollama/ollama:0.32.15
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models:ro

  guard-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.guard
    ports: ["8001:8001"]
    environment:
      OLLAMA_URL: http://ollama:11434
      GUARD_MODEL: ${GUARD_MODEL:-ru-guard-1.5b-v2}
      GUARD_API_KEY: ${GUARD_API_KEY:-}
      AUDIT_SALT: ${AUDIT_SALT:-}
      FAIL_MODE: ${FAIL_MODE:-closed}
      MODE: ${MODE:-enforce}
      RATE_LIMIT: ${RATE_LIMIT:-120/minute}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      DB_PATH: /data/guard.db
    volumes:
      - guard_data:/data
    depends_on: [ollama]

volumes:
  ollama_data: {}
  guard_data: {}
